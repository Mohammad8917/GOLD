name: GOLD Telegram connectivity test (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    name: Windows Telegram delivery check
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GOLD_TELEGRAM_BOT_TOKEN: ${{ secrets.GOLD_TELEGRAM_BOT_TOKEN }}
      GOLD_TELEGRAM_CHAT_ID: ${{ secrets.GOLD_TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Telegram secrets are configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOLD_TELEGRAM_BOT_TOKEN)) {
            throw "Repository Actions secret GOLD_TELEGRAM_BOT_TOKEN is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:GOLD_TELEGRAM_CHAT_ID)) {
            throw "Repository Actions secret GOLD_TELEGRAM_CHAT_ID is missing."
          }

      - name: Install bot dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools\gold_signal_bot\requirements.txt

      - name: Send one explicit connectivity test message
        shell: pwsh
        run: |
          python tools\gold_signal_bot\gold_signal_bot.py --test-telegram
