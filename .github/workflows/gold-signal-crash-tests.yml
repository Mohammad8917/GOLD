name: GOLD WAL crash-boundary tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "tools/gold_signal_bot/crash_tests/**"
      - ".github/workflows/gold-signal-crash-tests.yml"

permissions:
  contents: read

jobs:
  crash-recovery:
    name: WAL crash recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependency
        run: python -m pip install requests
      - name: Run real subprocess crash-boundary tests
        working-directory: tools/gold_signal_bot
        run: python crash_tests/test_crash_subprocess.py
